<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3E8FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" filter="url(#glow)"/>
  
  <!-- Play Button Icon -->
  <path d="M24 20L44 32L24 44V20Z" fill="url(#iconGradient)" stroke="none"/>
  
  <!-- Gaming Controller Elements -->
  <circle cx="20" cy="16" r="2" fill="url(#iconGradient)" opacity="0.8"/>
  <circle cx="44" cy="16" r="2" fill="url(#iconGradient)" opacity="0.8"/>
  <circle cx="20" cy="48" r="2" fill="url(#iconGradient)" opacity="0.8"/>
  <circle cx="44" cy="48" r="2" fill="url(#iconGradient)" opacity="0.8"/>
  
  <!-- Live Indicator -->
  <circle cx="48" cy="16" r="4" fill="#EF4444" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="20" text-anchor="middle" fill="white" font-size="6" font-weight="bold">●</text>
</svg>